# Standalone mock inbox: no application or database secrets required.
services:
  mailpit:
    image: axllent/mailpit:v1.27.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    networks:
      - mock_mail

networks:
  mock_mail:
    internal: true
