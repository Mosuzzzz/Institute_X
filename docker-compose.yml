services:
  redis-tls-init:
    image: alpine/openssl@sha256:80b347d7b4d58e28aae515cf808ba3ce1c4a2a69a323b2cb2cb2d6d278729684
    restart: "no"
    entrypoint: []
    command:
      - /bin/sh
      - -ec
      - |
        if [ ! -s /private/ca.key ] || [ ! -s /public/ca.crt ]; then
          openssl req -x509 -newkey rsa:2048 -nodes -days 3650 \
            -keyout /private/ca.key -out /public/ca.crt -subj "/CN=Institute X Redis CA"
        fi
        openssl req -newkey rsa:2048 -nodes \
          -keyout /private/redis.key -out /private/redis.csr \
          -subj "/CN=redis" -addext "subjectAltName=DNS:redis,DNS:localhost,IP:127.0.0.1"
        openssl x509 -req -days 825 -sha256 \
          -in /private/redis.csr -CA /public/ca.crt -CAkey /private/ca.key \
          -CAcreateserial -out /public/redis.crt -copy_extensions copy
        chmod 600 /private/ca.key /private/redis.key
        chmod 644 /public/ca.crt /public/redis.crt
    volumes:
      - redis_tls_private:/private
      - redis_tls_public:/public
    networks:
      - internal
      - local

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    depends_on:
      redis-tls-init:
        condition: service_completed_successfully
    command:
      - sh
      - -ec
      - >-
        exec redis-server --appendonly yes --port 0 --tls-port 6379
        --tls-cert-file /public/redis.crt --tls-key-file /private/redis.key
        --tls-ca-cert-file /public/ca.crt --tls-auth-clients no
        --requirepass "$${REDIS_PASSWORD}"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    volumes:
      - redis_data:/data
      - redis_tls_private:/private:ro
      - redis_tls_public:/public:ro
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --tls --cacert /public/ca.crt --sni redis -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal
      - local

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-institute_x}
      POSTGRES_USER: ${POSTGRES_USER:-institute_x}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal
      - local

  minio:
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-institute_x}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - edge
      - internal

  minio-init:
    image: quay.io/minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-institute_x}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-institute-x-private}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing "local/$${S3_BUCKET}" &&
        mc anonymous set none "local/$${S3_BUCKET}"
    networks:
      - internal

  mailpit:
    image: axllent/mailpit:v1.27.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - internal
      - local

  migrate:
    build:
      context: ./backend
      target: migration
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-institute_x}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-institute_x}
    networks:
      - internal

  backend:
    build:
      context: ./backend
      target: production
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    environment:
      # Demo deployment: Mailpit is intentionally unavailable in production mode.
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-institute_x}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-institute_x}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      REDIS_URL: rediss://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379
      NODE_EXTRA_CA_CERTS: /etc/redis/tls/ca.crt
      AUTH_SESSION_CACHE_TTL_SECONDS: ${AUTH_SESSION_CACHE_TTL_SECONDS:-60}
      AUTH_CACHE_SIGNING_KEY: ${AUTH_CACHE_SIGNING_KEY:?Set AUTH_CACHE_SIGNING_KEY}
      OTP_HASH_SECRET: ${OTP_HASH_SECRET:?Set OTP_HASH_SECRET}
      OTP_EMAIL_PROVIDER: mailpit
      MAILPIT_HOST: mailpit
      MAILPIT_SMTP_PORT: 1025
      OTP_FROM_EMAIL: ${OTP_FROM_EMAIL:?Set OTP_FROM_EMAIL}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-institute-x-private}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-institute_x}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      S3_FORCE_PATH_STYLE: "true"
      S3_SIGNED_URL_TTL_SECONDS: ${S3_SIGNED_URL_TTL_SECONDS:-300}
    volumes:
      - redis_tls_public:/etc/redis/tls:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - edge
      - internal

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_BASE_URL: http://backend:3000
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - edge
      - internal

networks:
  edge:
  local:
  internal:
    internal: true

volumes:
  redis_data:
  redis_tls_private:
  redis_tls_public:
  postgres_data:
  minio_data:
