# Install as /etc/nginx/sites-available/institute-x.conf and symlink it into
# /etc/nginx/sites-enabled. Certbot can add the HTTPS listeners after DNS works.

limit_req_zone $binary_remote_addr zone=institute_x_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=institute_x_otp:10m rate=5r/m;

# The proxy header set used by this site is larger than nginx's conservative
# defaults. Explicit sizing prevents harmless hash warnings during reloads.
proxy_headers_hash_max_size 1024;
proxy_headers_hash_bucket_size 128;

# Preserve the browser-facing HTTPS scheme supplied by Cloudflare Tunnel.
# Fall back to the origin connection scheme for direct requests.
map $http_x_forwarded_proto $institute_x_forwarded_proto {
    default $scheme;
    https https;
}

# cloudflared connects locally and supplies the original visitor address.
set_real_ip_from 127.0.0.1;
set_real_ip_from ::1;
real_ip_header CF-Connecting-IP;

server {
    listen 80;
    listen [::]:80;
    server_name x.mosuzzzz.online;

    client_max_body_size 25m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /health {
        access_log off;
        proxy_pass http://127.0.0.1:3001/;
        proxy_set_header Host $host;
    }

    location ^~ /api/auth/otp/ {
        limit_req zone=institute_x_otp burst=3 nodelay;
        proxy_pass http://127.0.0.1:3001;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $institute_x_forwarded_proto;
    }

    location ^~ /api/ {
        limit_req zone=institute_x_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:3001;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $institute_x_forwarded_proto;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3001;
        include proxy_params;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        include proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-Proto $institute_x_forwarded_proto;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name media.mosuzzzz.online;

    client_max_body_size 1g;
    proxy_request_buffering off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $institute_x_forwarded_proto;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name mailpit.mosuzzzz.online;

    auth_basic "Institute X demo inbox";
    auth_basic_user_file /etc/nginx/.htpasswd-institute-x;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:8025;
        include proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-Proto $institute_x_forwarded_proto;
    }
}
